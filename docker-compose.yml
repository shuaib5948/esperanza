services:
  mysql:
    image: mysql:8.0
    container_name: esperanza_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: esperanza
      MYSQL_USER: esperanza_user
      MYSQL_PASSWORD: esperanza_secret
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: esperanza_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: esperanza
      DB_USER: esperanza_user
      DB_PASSWORD: esperanza_secret
      JWT_SECRET: super_secret_esperanza_jwt_key_2026_change_in_production
      JWT_REFRESH_SECRET: super_secret_esperanza_refresh_jwt_key_2026
      CLIENT_URL: http://localhost:5173
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: esperanza_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mysql_data:
    driver: local
